<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Link Note - Simpan Tautan</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, sans-serif;
  }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  .container {
    background: #fff;
    width: 100%;
    max-width: 600px;
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    padding: 30px;
    margin-top: 20px;
  }

  h1 {
    text-align: center;
    color: #333;
    margin-bottom: 8px;
    font-size: 1.8rem;
  }

  .subtitle {
    text-align: center;
    color: #888;
    font-size: 0.9rem;
    margin-bottom: 25px;
  }

  .input-group {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
  }

  #linkInput {
    flex: 1;
    padding: 14px 16px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.3s;
  }

  #linkInput:focus {
    border-color: #667eea;
  }

  #saveBtn {
    padding: 14px 24px;
    background: #667eea;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.3s, transform 0.1s;
    white-space: nowrap;
  }

  #saveBtn:hover {
    background: #5568d3;
  }

  #saveBtn:active {
    transform: scale(0.97);
  }

  .link-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .link-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #f7f8fc;
    padding: 14px 16px;
    border-radius: 10px;
    border-left: 4px solid #667eea;
    animation: fadeIn 0.3s ease;
    transition: transform 0.2s;
  }

  .link-item:hover {
    transform: translateX(4px);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .link-item a {
    flex: 1;
    color: #333;
    text-decoration: none;
    word-break: break-all;
    font-size: 0.95rem;
    transition: color 0.2s;
  }

  .link-item a:hover {
    color: #667eea;
    text-decoration: underline;
  }

  .delete-btn {
    background: transparent;
    border: none;
    color: #e74c3c;
    font-size: 1.2rem;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    transition: background 0.2s;
    flex-shrink: 0;
  }

  .delete-btn:hover {
    background: #fdecea;
  }

  .empty-msg {
    text-align: center;
    color: #aaa;
    padding: 30px 0;
    font-style: italic;
    display: none;
  }

  .empty-msg.show {
    display: block;
  }
</style>
</head>
<body>

<div class="container">
  <h1>🔗 Link Note</h1>
  <p class="subtitle">Simpan tautan penting Anda di sini</p>

  <div class="input-group">
    <input type="url" id="linkInput" placeholder="Tempel link di sini (https://...)" />
    <button id="saveBtn">Simpan</button>
  </div>

  <ul class="link-list" id="linkList"></ul>
  <p class="empty-msg" id="emptyMsg">Belum ada link tersimpan.</p>
</div>

<script>
  const linkInput = document.getElementById('linkInput');
  const saveBtn = document.getElementById('saveBtn');
  const linkList = document.getElementById('linkList');
  const emptyMsg = document.getElementById('emptyMsg');

  // Ambil data dari localStorage
  let links = JSON.parse(localStorage.getItem('savedLinks')) || [];

  // Simpan ke localStorage
  function saveToStorage() {
    localStorage.setItem('savedLinks', JSON.stringify(links));
  }

  // Render daftar link
  function renderLinks() {
    linkList.innerHTML = '';
    emptyMsg.classList.toggle('show', links.length === 0);

    links.forEach((link, index) => {
      const li = document.createElement('li');
      li.className = 'link-item';

      const a = document.createElement('a');
      a.href = link;
      a.textContent = link;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';

      const delBtn = document.createElement('button');
      delBtn.className = 'delete-btn';
      delBtn.innerHTML = '🗑️';
      delBtn.title = 'Hapus link';
      delBtn.onclick = () => deleteLink(index);

      li.appendChild(a);
      li.appendChild(delBtn);
      linkList.appendChild(li);
    });
  }

  // Tambah link
  function addLink() {
    let url = linkInput.value.trim();

    if (!url) {
      alert('Silakan masukkan link terlebih dahulu!');
      return;
    }

    // Tambahkan https:// jika belum ada protokol
    if (!/^https?:\/\//i.test(url)) {
      url = 'https://' + url;
    }

    // Validasi URL
    try {
      new URL(url);
    } catch (e) {
      alert('Format link tidak valid!');
      return;
    }

    links.push(url);
    saveToStorage();
    renderLinks();
    linkInput.value = '';
    linkInput.focus();
  }

  // Hapus link
  function deleteLink(index) {
    if (confirm('Hapus link ini?')) {
      links.splice(index, 1);
      saveToStorage();
      renderLinks();
    }
  }

  // Event listener
  saveBtn.addEventListener('click', addLink);
  linkInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') addLink();
  });

  // Render awal
  renderLinks();
</script>

</body>
</html>
