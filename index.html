<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Link Note - Simpan Tautan</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, sans-serif;
  }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  .container {
    background: #fff;
    width: 100%;
    max-width: 640px;
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    padding: 30px;
    margin-top: 20px;
  }

  h1 {
    text-align: center;
    color: #333;
    margin-bottom: 8px;
    font-size: 1.8rem;
  }

  .subtitle {
    text-align: center;
    color: #888;
    font-size: 0.9rem;
    margin-bottom: 25px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
  }

  .row {
    display: flex;
    gap: 10px;
  }

  #titleInput,
  #linkInput,
  #searchInput {
    flex: 1;
    padding: 14px 16px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.3s;
  }

  #titleInput:focus,
  #linkInput:focus,
  #searchInput:focus {
    border-color: #667eea;
  }

  #saveBtn {
    padding: 14px 24px;
    background: #667eea;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.3s, transform 0.1s;
    white-space: nowrap;
  }

  #saveBtn:hover {
    background: #5568d3;
  }

  #saveBtn:active {
    transform: scale(0.97);
  }

  .search-box {
    position: relative;
    margin-bottom: 20px;
  }

  .search-box::before {
    content: '🔍';
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1rem;
    opacity: 0.6;
    pointer-events: none;
  }

  #searchInput {
    width: 100%;
    padding-left: 42px;
  }

  .link-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .link-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: #f7f8fc;
    padding: 14px 16px;
    border-radius: 10px;
    border-left: 4px solid #667eea;
    animation: fadeIn 0.3s ease;
    transition: transform 0.2s;
  }

  .link-item:hover {
    transform: translateX(4px);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .link-content {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .link-title {
    font-weight: 600;
    color: #333;
    font-size: 1rem;
    word-break: break-word;
  }

  .link-title .highlight {
    background: #fff59d;
    border-radius: 3px;
    padding: 0 2px;
  }

  .link-url {
    color: #667eea;
    text-decoration: none;
    word-break: break-all;
    font-size: 0.85rem;
    transition: color 0.2s;
  }

  .link-url:hover {
    color: #5568d3;
    text-decoration: underline;
  }

  .delete-btn {
    background: transparent;
    border: none;
    color: #e74c3c;
    font-size: 1.2rem;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    transition: background 0.2s;
    flex-shrink: 0;
  }

  .delete-btn:hover {
    background: #fdecea;
  }

  .empty-msg {
    text-align: center;
    color: #aaa;
    padding: 30px 0;
    font-style: italic;
    display: none;
  }

  .empty-msg.show {
    display: block;
  }

  .search-info {
    text-align: center;
    color: #888;
    font-size: 0.85rem;
    margin-bottom: 12px;
    display: none;
  }

  .search-info.show {
    display: block;
  }

  .search-info strong {
    color: #667eea;
  }

  /* PAGINATION */
  .pagination {
    display: none;
    justify-content: center;
    align-items: center;
    gap: 6px;
    margin-top: 22px;
    flex-wrap: wrap;
  }

  .pagination.show {
    display: flex;
  }

  .pagination button {
    min-width: 38px;
    height: 38px;
    padding: 0 10px;
    border: 2px solid #e0e0e0;
    background: #fff;
    color: #555;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  .pagination button:hover:not(:disabled):not(.active) {
    border-color: #667eea;
    color: #667eea;
  }

  .pagination button.active {
    background: #667eea;
    border-color: #667eea;
    color: #fff;
    cursor: default;
  }

  .pagination button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .pagination .ellipsis {
    padding: 0 4px;
    color: #aaa;
    font-weight: 600;
  }

  @media (max-width: 480px) {
    .row {
      flex-direction: column;
    }
    #saveBtn {
      width: 100%;
    }
    .pagination button {
      min-width: 34px;
      height: 34px;
      font-size: 0.85rem;
    }
  }
</style>
</head>
<body>

<div class="container">
  <h1>🔗 Link Note</h1>
  <p class="subtitle">Simpan tautan penting Anda di sini</p>

  <div class="form-group">
    <input type="text" id="titleInput" placeholder="Judul link (contoh: Google)" />
    <div class="row">
      <input type="url" id="linkInput" placeholder="Tempel link di sini (https://...)" />
      <button id="saveBtn">Simpan</button>
    </div>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Cari judul link..." />
  </div>

  <p class="search-info" id="searchInfo"></p>

  <ul class="link-list" id="linkList"></ul>
  <p class="empty-msg" id="emptyMsg">Belum ada link tersimpan.</p>

  <div class="pagination" id="pagination"></div>
</div>

<script>
  const titleInput = document.getElementById('titleInput');
  const linkInput = document.getElementById('linkInput');
  const searchInput = document.getElementById('searchInput');
  const saveBtn = document.getElementById('saveBtn');
  const linkList = document.getElementById('linkList');
  const emptyMsg = document.getElementById('emptyMsg');
  const searchInfo = document.getElementById('searchInfo');
  const pagination = document.getElementById('pagination');

  const ITEMS_PER_PAGE = 10;
  let currentPage = 1;

  // Ambil data dari localStorage (mendukung format lama & baru)
  let links = JSON.parse(localStorage.getItem('savedLinks')) || [];
  links = links.map(item =>
    typeof item === 'string' ? { title: item, url: item } : item
  );

  // Simpan ke localStorage
  function saveToStorage() {
    localStorage.setItem('savedLinks', JSON.stringify(links));
  }

  // Escape HTML
  function escapeHTML(str) {
    return str.replace(/[&<>"']/g, (m) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  // Highlight teks cocok
  function highlight(text, keyword) {
    if (!keyword) return escapeHTML(text);
    const escapedText = escapeHTML(text);
    const escapedKeyword = escapeHTML(keyword).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const regex = new RegExp(`(${escapedKeyword})`, 'gi');
    return escapedText.replace(regex, '<span class="highlight">$1</span>');
  }

  // Ambil daftar link terfilter (berdasarkan judul)
  function getFilteredLinks() {
    const keyword = searchInput.value.trim().toLowerCase();
    return links
      .map((item, index) => ({ item, index }))
      .filter(({ item }) =>
        !keyword || (item.title || '').toLowerCase().includes(keyword)
      );
  }

  // Render halaman + pagination
  function renderLinks() {
    const keyword = searchInput.value.trim().toLowerCase();
    const filtered = getFilteredLinks();

    const totalPages = Math.max(1, Math.ceil(filtered.length / ITEMS_PER_PAGE));

    // Pastikan currentPage valid
    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;

    const start = (currentPage - 1) * ITEMS_PER_PAGE;
    const pageItems = filtered.slice(start, start + ITEMS_PER_PAGE);

    // Render list
    linkList.innerHTML = '';

    // Pesan kosong
    if (links.length === 0) {
      emptyMsg.textContent = 'Belum ada link tersimpan.';
      emptyMsg.classList.add('show');
    } else if (filtered.length === 0) {
      emptyMsg.textContent = `Tidak ada link dengan judul mengandung "${searchInput.value.trim()}".`;
      emptyMsg.classList.add('show');
    } else {
      emptyMsg.classList.remove('show');
    }

    // Info hasil pencarian
    if (keyword && links.length > 0 && filtered.length > 0) {
      searchInfo.innerHTML = `Menampilkan <strong>${filtered.length}</strong> dari <strong>${links.length}</strong> link`;
      searchInfo.classList.add('show');
    } else {
      searchInfo.classList.remove('show');
    }

    // Render tiap item di halaman ini
    pageItems.forEach(({ item, index }) => {
      const li = document.createElement('li');
      li.className = 'link-item';

      const content = document.createElement('div');
      content.className = 'link-content';

      const title = document.createElement('span');
      title.className = 'link-title';
      title.innerHTML = highlight(item.title || item.url, keyword);

      const a = document.createElement('a');
      a.className = 'link-url';
      a.href = item.url;
      a.textContent = item.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';

      content.appendChild(title);
      content.appendChild(a);

      const delBtn = document.createElement('button');
      delBtn.className = 'delete-btn';
      delBtn.innerHTML = '🗑️';
      delBtn.title = 'Hapus link';
      delBtn.onclick = () => deleteLink(index);

      li.appendChild(content);
      li.appendChild(delBtn);
      linkList.appendChild(li);
    });

    // Render pagination
    renderPagination(totalPages, filtered.length);
  }

  // Render tombol-tombol pagination
  function renderPagination(totalPages, totalItems) {
    pagination.innerHTML = '';

    // Sembunyikan jika hanya 1 halaman
    if (totalItems <= ITEMS_PER_PAGE) {
      pagination.classList.remove('show');
      return;
    }
    pagination.classList.add('show');

    // Tombol "Prev"
    const prevBtn = document.createElement('button');
    prevBtn.textContent = '‹';
    prevBtn.disabled = currentPage === 1;
    prevBtn.onclick = () => goToPage(currentPage - 1);
    pagination.appendChild(prevBtn);

    // Nomor halaman dengan ellipsis
    const pages = getPageNumbers(currentPage, totalPages);

    pages.forEach(p => {
      if (p === '...') {
        const span = document.createElement('span');
        span.className = 'ellipsis';
        span.textContent = '…';
        pagination.appendChild(span);
      } else {
        const btn = document.createElement('button');
        btn.textContent = p;
        if (p === currentPage) btn.classList.add('active');
        btn.onclick = () => goToPage(p);
        pagination.appendChild(btn);
      }
    });

    // Tombol "Next"
    const nextBtn = document.createElement('button');
    nextBtn.textContent = '›';
    nextBtn.disabled = currentPage === totalPages;
    nextBtn.onclick = () => goToPage(currentPage + 1);
    pagination.appendChild(nextBtn);
  }

  // Logika nomor halaman (dengan ellipsis untuk halaman banyak)
  function getPageNumbers(current, total) {
    if (total <= 7) {
      return Array.from({ length: total }, (_, i) => i + 1);
    }
    const pages = [];
    if (current <= 4) {
      pages.push(1, 2, 3, 4, 5, '...', total);
    } else if (current >= total - 3) {
      pages.push(1, '...', total - 4, total - 3, total - 2, total - 1, total);
    } else {
      pages.push(1, '...', current - 1, current, current + 1, '...', total);
    }
    return pages;
  }

  // Pindah halaman
  function goToPage(page) {
    currentPage = page;
    renderLinks();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // Tambah link
  function addLink() {
    const title = titleInput.value.trim();
    let url = linkInput.value.trim();

    if (!url) {
      alert('Silakan masukkan link terlebih dahulu!');
      linkInput.focus();
      return;
    }

    if (!/^https?:\/\//i.test(url)) {
      url = 'https://' + url;
    }

    try {
      new URL(url);
    } catch (e) {
      alert('Format link tidak valid!');
      return;
    }

    links.push({ title: title || url, url });
    saveToStorage();

    titleInput.value = '';
    linkInput.value = '';
    titleInput.focus();

    // Reset pencarian agar link baru terlihat
    if (searchInput.value.trim()) {
      searchInput.value = '';
    }

    // Arahkan ke halaman terakhir agar link baru terlihat
    currentPage = Math.ceil(links.length / ITEMS_PER_PAGE);
    renderLinks();
  }

  // Hapus link
  function deleteLink(index) {
    if (confirm('Hapus link ini?')) {
      links.splice(index, 1);
      saveToStorage();
      renderLinks();
    }
  }

  // Event listener
  saveBtn.addEventListener('click', addLink);
  searchInput.addEventListener('input', () => {
    currentPage = 1; // reset ke halaman 1 saat mencari
    renderLinks();
  });
  [titleInput, linkInput].forEach(input => {
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addLink();
    });
  });

  // Render awal
  renderLinks();
</script>

</body>
</html>
